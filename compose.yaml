services:
  migrate:
    profiles: ["notifications"]
    image: ruris-notifications:local
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: ["python", "-m", "flask", "--app", "app", "db", "upgrade"]
    depends_on:
      db:
        condition: service_healthy

  notification-worker:
    profiles: ["notifications"]
    image: ruris-notifications:local
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-LOCAL_MAILPIT}
    command: ["python", "-m", "flask", "--app", "app", "run-notification-worker"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configureaza POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configureaza POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configureaza POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
